<!DOCTYPE html>
<html>
<head>
  <title>Debug Grammar Reference</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    .info { color: blue; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Grammar Reference Debug</h1>
  <div id="output"></div>

  <!-- Load all lesson data -->
  <script src="js/data/minna/lesson-01.js"></script>
  <script src="js/data/minna/lesson-02.js"></script>
  <script src="js/data/minna/lesson-03.js"></script>
  <script src="js/data/minna/lesson-04.js"></script>
  <script src="js/data/minna/lesson-05.js"></script>
  <script src="js/data/minna/lesson-06.js"></script>
  <script src="js/data/minna/lesson-07.js"></script>
  <script src="js/data/minna/lesson-08.js"></script>
  <script src="js/data/minna/lesson-09.js"></script>
  <script src="js/data/minna/lesson-10.js"></script>
  <script src="js/data/minna/lesson-11.js"></script>
  <script src="js/data/minna/lesson-12.js"></script>
  <script src="js/data/minna/lesson-13.js"></script>
  <script src="js/data/minna/lesson-14.js"></script>
  <script src="js/data/minna/lesson-15.js"></script>
  <script src="js/data/minna/lesson-16.js"></script>
  <script src="js/data/minna/lesson-17.js"></script>
  <script src="js/data/minna/lesson-18.js"></script>
  <script src="js/data/minna/lesson-19.js"></script>
  <script src="js/data/minna/lesson-20.js"></script>
  <script src="js/data/minna/lesson-21.js"></script>
  <script src="js/data/minna/lesson-22.js"></script>
  <script src="js/data/minna/lesson-23.js"></script>
  <script src="js/data/minna/lesson-24.js"></script>
  <script src="js/data/minna/lesson-25.js"></script>

  <!-- Load grammar systems -->
  <script src="js/data/minna/grammar-index.js"></script>
  <script src="js/data/minna/grammar-metadata.js"></script>
  <script src="js/core/grammar-utils.js"></script>

  <script>
    const output = document.getElementById('output');

    function log(msg, type = 'info') {
      const p = document.createElement('p');
      p.className = type;
      p.textContent = msg;
      output.appendChild(p);
    }

    function logJSON(label, data) {
      const div = document.createElement('div');
      div.innerHTML = `<strong>${label}:</strong>`;
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(data, null, 2);
      div.appendChild(pre);
      output.appendChild(div);
    }

    // Test 1: Check if lessons are loaded
    log('=== Test 1: Lesson Data ===', 'info');
    let lessonCount = 0;
    let grammarCount = 0;
    for (let i = 1; i <= 25; i++) {
      const key = `LESSON_${String(i).padStart(2, '0')}_DATA`;
      if (window[key]) {
        lessonCount++;
        if (window[key].grammar && window[key].grammar.length > 0) {
          grammarCount += window[key].grammar.length;
          log(`✓ ${key}: ${window[key].grammar.length} patterns`, 'success');
        } else {
          log(`⚠ ${key}: No grammar`, 'error');
        }
      } else {
        log(`✗ ${key}: Not loaded`, 'error');
      }
    }
    log(`Total lessons loaded: ${lessonCount}/25`, lessonCount === 25 ? 'success' : 'error');
    log(`Total grammar patterns: ${grammarCount}`, 'info');

    // Test 2: Check grammar-index
    log('\n=== Test 2: Grammar Index ===', 'info');
    if (window.QuizApp && window.QuizApp.grammarIndex) {
      log('✓ grammarIndex module loaded', 'success');

      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      log(`✓ getAllGrammar() returned ${allGrammar.length} patterns`, 'success');

      if (allGrammar.length > 0) {
        logJSON('First pattern', allGrammar[0]);
        logJSON('Last pattern', allGrammar[allGrammar.length - 1]);
      } else {
        log('✗ getAllGrammar() returned empty array!', 'error');
      }

      const stats = window.QuizApp.grammarIndex.getStatistics();
      logJSON('Statistics', stats);
    } else {
      log('✗ grammarIndex NOT loaded', 'error');
    }

    // Test 3: Check grammar-metadata
    log('\n=== Test 3: Grammar Metadata ===', 'info');
    if (window.QuizApp && window.QuizApp.grammarMetadata) {
      log('✓ grammarMetadata module loaded', 'success');

      const metadata = window.QuizApp.grammarMetadata.GRAMMAR_PATTERNS;
      const metadataCount = Object.keys(metadata || {}).length;
      log(`✓ Metadata for ${metadataCount} patterns`, 'success');

      const categories = window.QuizApp.grammarMetadata.GRAMMAR_CATEGORIES;
      log(`✓ ${Object.keys(categories || {}).length} categories defined`, 'success');

      const functions = window.QuizApp.grammarMetadata.GRAMMAR_FUNCTIONS;
      log(`✓ ${Object.keys(functions || {}).length} functions defined`, 'success');
    } else {
      log('✗ grammarMetadata NOT loaded', 'error');
    }

    // Test 4: Check grammar-utils
    log('\n=== Test 4: Grammar Utils ===', 'info');
    if (window.QuizApp && window.QuizApp.grammarUtils) {
      log('✓ grammarUtils module loaded', 'success');

      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      const merged = window.QuizApp.grammarUtils.mergeGrammarWithMetadata(allGrammar);
      log(`✓ mergeGrammarWithMetadata: ${merged.length} patterns`, 'success');

      if (merged.length > 0) {
        const withMeta = merged.filter(p => p.meta && Object.keys(p.meta).length > 0);
        log(`✓ Patterns with metadata: ${withMeta.length}/${merged.length}`, 'success');

        if (withMeta.length > 0) {
          logJSON('Pattern with metadata', withMeta[0]);
        }
      }

      // Test search
      const searchResults = window.QuizApp.grammarUtils.searchGrammar(merged, 'は');
      log(`✓ Search 'は': ${searchResults.length} results`, 'success');
    } else {
      log('✗ grammarUtils NOT loaded', 'error');
    }

    log('\n=== SUMMARY ===', 'info');
    log(`Lessons: ${lessonCount}/25`, 'info');
    log(`Grammar patterns: ${grammarCount}`, 'info');
    log('Status: ' + (lessonCount === 25 && grammarCount > 0 ? 'READY ✓' : 'ERROR ✗'),
        lessonCount === 25 && grammarCount > 0 ? 'success' : 'error');
  </script>
</body>
</html>
