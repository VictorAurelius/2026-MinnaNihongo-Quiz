<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Verify Grammar Fix</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .pass { color: #10b981; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }
    .count { color: #fbbf24; font-size: 24px; font-weight: bold; }
    pre { background: #2d2d2d; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🔧 Grammar Data Fix Verification</h1>
  <div id="output"></div>

  <!-- Load lesson files -->
  <script src="js/data/minna/lesson-01.js"></script>
  <script src="js/data/minna/lesson-02.js"></script>
  <script src="js/data/minna/lesson-03.js"></script>
  <script src="js/data/minna/lesson-04.js"></script>
  <script src="js/data/minna/lesson-05.js"></script>
  <script src="js/data/minna/lesson-06.js"></script>
  <script src="js/data/minna/lesson-07.js"></script>
  <script src="js/data/minna/lesson-08.js"></script>
  <script src="js/data/minna/lesson-09.js"></script>
  <script src="js/data/minna/lesson-10.js"></script>
  <script src="js/data/minna/lesson-11.js"></script>
  <script src="js/data/minna/lesson-12.js"></script>
  <script src="js/data/minna/lesson-13.js"></script>
  <script src="js/data/minna/lesson-14.js"></script>
  <script src="js/data/minna/lesson-15.js"></script>
  <script src="js/data/minna/lesson-16.js"></script>
  <script src="js/data/minna/lesson-17.js"></script>
  <script src="js/data/minna/lesson-18.js"></script>
  <script src="js/data/minna/lesson-19.js"></script>
  <script src="js/data/minna/lesson-20.js"></script>
  <script src="js/data/minna/lesson-21.js"></script>
  <script src="js/data/minna/lesson-22.js"></script>
  <script src="js/data/minna/lesson-23.js"></script>
  <script src="js/data/minna/lesson-24.js"></script>
  <script src="js/data/minna/lesson-25.js"></script>

  <!-- Load grammar system -->
  <script src="js/data/minna/grammar-index.js"></script>
  <script src="js/data/minna/grammar-metadata.js"></script>
  <script src="js/data/minna/grammar-utils.js"></script>

  <script>
    const output = document.getElementById('output');

    function log(msg, className = '') {
      const p = document.createElement('p');
      p.className = className;
      p.textContent = msg;
      output.appendChild(p);
    }

    function logJSON(label, data) {
      const div = document.createElement('div');
      div.innerHTML = `<strong>${label}:</strong>`;
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(data, null, 2);
      div.appendChild(pre);
      output.appendChild(div);
    }

    // Test 1: Check window.LESSON_01_DATA
    log('TEST 1: Check window.LESSON_01_DATA');
    if (window.LESSON_01_DATA) {
      log('✓ PASS: window.LESSON_01_DATA exists', 'pass');
      log(`  - Lesson title: ${window.LESSON_01_DATA.title}`);
      log(`  - Grammar patterns: ${window.LESSON_01_DATA.grammar?.length || 0}`);
    } else {
      log('✗ FAIL: window.LESSON_01_DATA is undefined', 'fail');
    }

    // Test 2: Check all lessons
    log('\nTEST 2: Check all 25 lessons');
    let loadedCount = 0;
    let totalGrammar = 0;
    for (let i = 1; i <= 25; i++) {
      const key = `LESSON_${String(i).padStart(2, '0')}_DATA`;
      if (window[key]) {
        loadedCount++;
        totalGrammar += window[key].grammar?.length || 0;
      }
    }
    if (loadedCount === 25) {
      log(`✓ PASS: All 25 lessons loaded`, 'pass');
      log(`  - Total grammar patterns: ${totalGrammar}`, 'count');
    } else {
      log(`✗ FAIL: Only ${loadedCount}/25 lessons loaded`, 'fail');
    }

    // Test 3: Check getAllGrammar()
    log('\nTEST 3: Check getAllGrammar()');
    if (window.QuizApp?.grammarIndex) {
      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      if (allGrammar.length > 0) {
        log(`✓ PASS: getAllGrammar() returned ${allGrammar.length} patterns`, 'pass');
        logJSON('First pattern', allGrammar[0]);
      } else {
        log('✗ FAIL: getAllGrammar() returned 0 patterns', 'fail');
      }
    } else {
      log('✗ FAIL: grammarIndex not loaded', 'fail');
    }

    // Test 4: Test search
    log('\nTEST 4: Test search for "は"');
    if (window.QuizApp?.grammarIndex && window.QuizApp?.grammarUtils) {
      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      const merged = window.QuizApp.grammarUtils.mergeGrammarWithMetadata(allGrammar);
      const searchResults = window.QuizApp.grammarUtils.searchGrammar(merged, 'は');

      if (searchResults.length > 0) {
        log(`✓ PASS: Search found ${searchResults.length} results`, 'pass');
        logJSON('First search result', searchResults[0]);
      } else {
        log('✗ FAIL: Search returned 0 results', 'fail');
      }
    } else {
      log('✗ FAIL: Utils not loaded', 'fail');
    }

    // Final summary
    log('\n========================================');
    if (loadedCount === 25 && totalGrammar > 0) {
      log('🎉 SUCCESS: Grammar Reference is FIXED!', 'pass count');
      log(`📊 Ready with ${totalGrammar} grammar patterns`, 'pass');
    } else {
      log('❌ FAILED: Still have issues', 'fail count');
    }
  </script>
</body>
</html>
