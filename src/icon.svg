<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Vibrant sunrise gradient -->
    <linearGradient id="sunriseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8E53;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA726;stop-opacity:1" />
    </linearGradient>

    <!-- Sparkle gradient -->
    <radialGradient id="sparkleGrad">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA726;stop-opacity:0.8" />
    </radialGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#sunriseGrad)"/>

  <!-- Rising sun circle -->
  <circle cx="256" cy="200" r="100" fill="#FFEB3B" opacity="0.9"/>
  <circle cx="256" cy="200" r="80" fill="#FFF59D" opacity="0.7"/>

  <!-- Sun rays -->
  <g opacity="0.6">
    <line x1="256" y1="80" x2="256" y2="120" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
    <line x1="340" y1="116" x2="310" y2="146" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
    <line x1="376" y1="200" x2="336" y2="200" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
    <line x1="340" y1="284" x2="310" y2="254" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
    <line x1="172" y1="116" x2="202" y2="146" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
    <line x1="136" y1="200" x2="176" y2="200" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
    <line x1="172" y1="284" x2="202" y2="254" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Japanese character in center of sun -->
  <text x="256" y="235"
        font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif"
        font-size="85"
        font-weight="bold"
        fill="#FF6B6B"
        text-anchor="middle">日</text>

  <!-- Book/learning element at bottom -->
  <g transform="translate(256, 380)">
    <!-- Open book -->
    <path d="M -70 -25 Q -70 -40, -50 -40 L -5 -40 Q 0 -40, 0 -30 L 0 25 Q 0 30, -5 30 L -50 30 Q -70 30, -70 15 Z"
          fill="white" opacity="0.95"/>
    <path d="M 70 -25 Q 70 -40, 50 -40 L 5 -40 Q 0 -40, 0 -30 L 0 25 Q 0 30, 5 30 L 50 30 Q 70 30, 70 15 Z"
          fill="white" opacity="0.95"/>

    <!-- Text lines on book -->
    <line x1="-50" y1="-20" x2="-15" y2="-20" stroke="#FF8E53" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="-5" x2="-15" y2="-5" stroke="#FF8E53" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="10" x2="-15" y2="10" stroke="#FF8E53" stroke-width="3" stroke-linecap="round"/>

    <!-- Hiragana on right page -->
    <text x="35" y="5" font-family="'Hiragino Sans', sans-serif" font-size="32" font-weight="bold" fill="#FF6B6B" text-anchor="middle">あ</text>
  </g>

  <!-- Sparkles for excitement -->
  <g opacity="0.9">
    <!-- Top left sparkle -->
    <circle cx="100" cy="100" r="8" fill="url(#sparkleGrad)"/>
    <line x1="100" y1="80" x2="100" y2="92" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="100" x2="92" y2="100" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="108" x2="100" y2="120" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="100" x2="120" y2="100" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>

    <!-- Top right sparkle -->
    <circle cx="412" cy="120" r="6" fill="url(#sparkleGrad)"/>
    <line x1="412" y1="105" x2="412" y2="114" stroke="#FFD93D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="397" y1="120" x2="406" y2="120" stroke="#FFD93D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="412" y1="126" x2="412" y2="135" stroke="#FFD93D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="418" y1="120" x2="427" y2="120" stroke="#FFD93D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bottom right sparkle -->
    <circle cx="420" cy="340" r="7" fill="url(#sparkleGrad)"/>
    <line x1="420" y1="323" x2="420" y2="333" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
    <line x1="403" y1="340" x2="413" y2="340" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="347" x2="420" y2="357" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
    <line x1="427" y1="340" x2="437" y2="340" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>

    <!-- Small sparkles -->
    <circle cx="90" cy="280" r="5" fill="#FFD93D" opacity="0.8"/>
    <circle cx="380" cy="260" r="4" fill="#FFF59D" opacity="0.9"/>
  </g>

  <!-- Trophy/achievement icon (bottom left) -->
  <g transform="translate(100, 420)" opacity="0.85">
    <path d="M -15 -15 L -15 0 L -10 5 L 10 5 L 15 0 L 15 -15 Q 15 -20, 10 -20 L -10 -20 Q -15 -20, -15 -15 Z"
          fill="#FFD93D"/>
    <circle cx="0" cy="-10" r="6" fill="#FFF59D"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FF6B6B" text-anchor="middle">★</text>
  </g>
</svg>
