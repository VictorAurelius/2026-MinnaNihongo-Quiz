<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quick Grammar Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; max-height: 300px; }
    h3 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>🔍 Quick Grammar Reference Test</h1>
  <p>Click các nút để test từng phần:</p>

  <button onclick="testLessonData()">1. Test Lesson Data</button>
  <button onclick="testGrammarIndex()">2. Test Grammar Index</button>
  <button onclick="testMetadata()">3. Test Metadata</button>
  <button onclick="testUtils()">4. Test Utils</button>
  <button onclick="testSearch()">5. Test Search</button>
  <button onclick="runAll()">▶️ Run All Tests</button>

  <div id="results"></div>

  <!-- Load dependencies -->
  <script src="js/data/minna/lesson-01.js"></script>
  <script src="js/data/minna/lesson-02.js"></script>
  <script src="js/data/minna/lesson-03.js"></script>
  <script src="js/data/minna/lesson-04.js"></script>
  <script src="js/data/minna/lesson-05.js"></script>
  <script src="js/data/minna/lesson-06.js"></script>
  <script src="js/data/minna/lesson-07.js"></script>
  <script src="js/data/minna/lesson-08.js"></script>
  <script src="js/data/minna/lesson-09.js"></script>
  <script src="js/data/minna/lesson-10.js"></script>
  <script src="js/data/minna/grammar-index.js"></script>
  <script src="js/data/minna/grammar-metadata.js"></script>
  <script src="js/core/grammar-utils.js"></script>

  <script>
    const results = document.getElementById('results');

    function showResult(title, message, type = 'info', data = null) {
      const div = document.createElement('div');
      div.className = `result ${type}`;
      let html = `<h3>${title}</h3><p>${message}</p>`;
      if (data) {
        html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      }
      div.innerHTML = html;
      results.appendChild(div);
    }

    function clearResults() {
      results.innerHTML = '';
    }

    function testLessonData() {
      clearResults();
      showResult('Test 1: Lesson Data', 'Checking if lessons are loaded...', 'info');

      let count = 0;
      let grammarCount = 0;
      let lessons = [];

      for (let i = 1; i <= 10; i++) {
        const key = `LESSON_${String(i).padStart(2, '0')}_DATA`;
        if (window[key]) {
          count++;
          if (window[key].grammar) {
            grammarCount += window[key].grammar.length;
            lessons.push({
              lesson: i,
              patterns: window[key].grammar.length,
              first: window[key].grammar[0]?.pattern || 'N/A'
            });
          }
        }
      }

      if (count > 0) {
        showResult(
          '✓ Lessons Loaded',
          `Found ${count}/10 lessons with ${grammarCount} total patterns`,
          'success',
          lessons
        );
      } else {
        showResult('✗ Error', 'No lessons loaded!', 'error');
      }
    }

    function testGrammarIndex() {
      clearResults();
      showResult('Test 2: Grammar Index', 'Testing grammarIndex module...', 'info');

      if (!window.QuizApp?.grammarIndex) {
        showResult('✗ Error', 'grammarIndex module not loaded!', 'error');
        return;
      }

      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      showResult(
        '✓ Grammar Index',
        `getAllGrammar() returned ${allGrammar.length} patterns`,
        allGrammar.length > 0 ? 'success' : 'error',
        allGrammar.slice(0, 3)
      );
    }

    function testMetadata() {
      clearResults();
      showResult('Test 3: Metadata', 'Testing metadata module...', 'info');

      if (!window.QuizApp?.grammarMetadata) {
        showResult('✗ Error', 'grammarMetadata module not loaded!', 'error');
        return;
      }

      const patterns = window.QuizApp.grammarMetadata.GRAMMAR_PATTERNS || {};
      const categories = window.QuizApp.grammarMetadata.GRAMMAR_CATEGORIES || {};
      const functions = window.QuizApp.grammarMetadata.GRAMMAR_FUNCTIONS || {};

      showResult(
        '✓ Metadata',
        `Patterns: ${Object.keys(patterns).length}, Categories: ${Object.keys(categories).length}, Functions: ${Object.keys(functions).length}`,
        'success',
        {
          samplePattern: patterns[Object.keys(patterns)[0]],
          sampleCategory: categories[Object.keys(categories)[0]]
        }
      );
    }

    function testUtils() {
      clearResults();
      showResult('Test 4: Utils', 'Testing utils module...', 'info');

      if (!window.QuizApp?.grammarUtils) {
        showResult('✗ Error', 'grammarUtils module not loaded!', 'error');
        return;
      }

      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      const merged = window.QuizApp.grammarUtils.mergeGrammarWithMetadata(allGrammar);

      showResult(
        '✓ Utils',
        `Merged ${merged.length} patterns`,
        'success',
        merged[0]
      );
    }

    function testSearch() {
      clearResults();
      showResult('Test 5: Search', 'Testing search functionality...', 'info');

      const allGrammar = window.QuizApp.grammarIndex.getAllGrammar();
      const merged = window.QuizApp.grammarUtils.mergeGrammarWithMetadata(allGrammar);

      const testQueries = ['は', 'です', 'ます', 'に'];
      const results = {};

      testQueries.forEach(query => {
        const found = window.QuizApp.grammarUtils.searchGrammar(merged, query);
        results[query] = {
          count: found.length,
          samples: found.slice(0, 2).map(p => p.pattern)
        };
      });

      const totalResults = Object.values(results).reduce((sum, r) => sum + r.count, 0);

      showResult(
        totalResults > 0 ? '✓ Search Works' : '✗ Search Failed',
        `Total results: ${totalResults}`,
        totalResults > 0 ? 'success' : 'error',
        results
      );
    }

    function runAll() {
      clearResults();
      setTimeout(() => testLessonData(), 100);
      setTimeout(() => testGrammarIndex(), 500);
      setTimeout(() => testMetadata(), 900);
      setTimeout(() => testUtils(), 1300);
      setTimeout(() => testSearch(), 1700);
    }

    // Auto-run on load
    window.addEventListener('load', () => {
      showResult('Ready', 'Click buttons to run tests', 'info');
    });
  </script>
</body>
</html>
