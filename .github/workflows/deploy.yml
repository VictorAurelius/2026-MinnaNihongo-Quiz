name: CI & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "v4-dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: svelte-app/package-lock.json

      - name: Install dependencies
        run: cd svelte-app && npm ci

      - name: Run unit & component tests
        run: cd svelte-app && npx vitest run

  # PR gate: strengthen the pull_request path beyond unit tests.
  # Adds svelte-check (0 errors), a production build, and the E2E suite.
  # Does NOT touch the build/deploy-on-main jobs below.
  pr-gate:
    name: PR Gate (check + build + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: svelte-app/package-lock.json

      - name: Install dependencies
        run: cd svelte-app && npm ci

      - name: Type-check (svelte-check — must be 0 errors)
        run: cd svelte-app && npm run check

      - name: Production build (validates build + SPA 404 fallback)
        run: cd svelte-app && npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browser (chromium)
        # NOTE: `--with-deps` runs `apt-get` via sudo and hung ~indefinitely on
        # this runner. ubuntu-latest ships the chromium system libs, so install
        # the browser binary only. If a future runner lacks a lib, the E2E step
        # fails fast with a clear missing-library error (not a hang).
        run: cd svelte-app && npx playwright install chromium

      # E2E scope: chromium project only (the trustworthy gate). The other
      # 4 browser projects (firefox/webkit/mobile) are not yet reconciled and
      # would slow every PR — defer them to a nightly/full run.
      # Run against the dev server (the verified-green local config). The CI
      # preview-build path serves build/ at root while the production build uses
      # base path /2026-Smart-Quiz, so CI='' forces Playwright's dev-server path.
      - name: E2E tests (chromium)
        run: cd svelte-app && npx playwright test --project=chromium
        env:
          CI: ''

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: svelte-app/package-lock.json

      - name: Install dependencies
        run: cd svelte-app && npm ci

      - name: Build SvelteKit app
        run: cd svelte-app && npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './svelte-app/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
